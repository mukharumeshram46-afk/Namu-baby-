name: MYRAA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:

      - name: Checkout MYRAA
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p ../release-apk

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found."
            exit 1
          fi

          cp "$APK" ../release-apk/MYRAA-debug.apk

      - name: Upload MYRAA APK
        uses: actions/upload-artifact@v7
        with:
          name: MYRAA-APK
          path: release-apk/MYRAA-debug.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
