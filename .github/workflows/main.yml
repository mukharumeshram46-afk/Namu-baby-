name: MYRAA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MYRAA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MYRAA
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify project
        run: |
          echo "===== PROJECT ====="
          pwd
          ls -la

          echo "===== APP ====="
          ls -la app

          echo "===== GRADLE ====="
          gradle --version

      - name: Build MYRAA APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Locate APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p release-apk

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          cp "$APK" release-apk/MYRAA-debug.apk

          echo "===== FINAL APK ====="
          ls -lh release-apk/MYRAA-debug.apk

      - name: Upload MYRAA APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-APK
          path: release-apk/MYRAA-debug.apk
          if-no-files-found: error
          retention-days: 30
