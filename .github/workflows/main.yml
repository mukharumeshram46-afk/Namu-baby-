name: MYRAA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MYRAA APK
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # 1. Checkout source
      # -----------------------------
      - name: Checkout MYRAA
        uses: actions/checkout@v6

      # -----------------------------
      # 2. Java 17
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # -----------------------------
      # 3. Android SDK
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # -----------------------------
      # 4. Install Android SDK
      # -----------------------------
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # -----------------------------
      # 5. IMPORTANT:
      # AGP 8.7.x = Gradle 8.9
      # -----------------------------
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # -----------------------------
      # 6. Show project
      # -----------------------------
      - name: Verify MYRAA project
        run: |
          echo "=============================="
          echo "MYRAA PROJECT"
          echo "=============================="

          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "App directory:"
          ls -la app

          echo ""
          echo "Gradle version:"
          gradle --version

      # -----------------------------
      # 7. Clean old generated files
      # -----------------------------
      - name: Clean project
        run: |
          gradle clean --stacktrace

      # -----------------------------
      # 8. Build Debug APK
      # -----------------------------
      - name: Build MYRAA Debug APK
        run: |
          gradle assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      # -----------------------------
      # 9. Verify APK
      # -----------------------------
      - name: Verify APK
        run: |
          echo "=============================="
          echo "SEARCHING FOR APK"
          echo "=============================="

          find . \
            -type f \
            -name "*.apk" \
            -print

      # -----------------------------
      # 10. Prepare final APK
      # -----------------------------
      - name: Prepare MYRAA APK
        run: |
          mkdir -p release-apk

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ APK NOT FOUND"
            exit 1
          fi

          echo "✅ APK FOUND:"
          echo "$APK"

          cp "$APK" release-apk/MYRAA-debug.apk

          echo ""
          echo "Final APK:"
          ls -lh release-apk/MYRAA-debug.apk

      # -----------------------------
      # 11. Upload APK
      # -----------------------------
      - name: Upload MYRAA APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-APK
          path: release-apk/MYRAA-debug.apk
          if-no-files-found: error
          retention-days: 30
